name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # erlaubt einen manuellen Start über den Actions-Tab
  workflow_dispatch:

# Rechte, die der Workflow zum Veröffentlichen braucht
permissions:
  contents: read
  pages: write
  id-token: write

# Läuft ein Deploy noch, wird er nicht abgebrochen, aber auch kein
# zweiter danebengestellt — der neuere wartet.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Astro 7 verlangt >= 22.12; die 22er-Linie deckt das ab.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Ab v4 landen Dotfiles nicht mehr im Artefakt. Für uns ohne Folgen:
      # dist enthält keine, und .nojekyll braucht dieser Deploy nicht —
      # das Artefakt wird direkt ausgeliefert, ohne Jekyll-Lauf.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
